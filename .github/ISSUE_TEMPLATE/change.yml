name: "\U0001F680 Request a change (not rule-related)"
description: 'Request a change that is not a bug fix, rule change, or new rule'
title: 'Change Request: (fill in)'
body:
  - type: textarea
    attributes:
      label: Environment
      description: |
        Please tell us about how you're running ESLint (Run `npx eslint --env-info`.)
      value: |
        ESLint version:
        @eslint/markdown version:
        eslint-markdown version:
        Node version:
        npm version:
        Operating System:
    validations:
      required: true
  - type: textarea
    attributes:
      label: What problem do you want to solve?
      description: |
        Please explain your use case in as much detail as possible.
      placeholder: |
        The Markdown plugin currently...
    validations:
      required: true
  - type: textarea
    attributes:
      label: What do you think is the correct solution?
      description: |
        Please explain how you'd like to change the Markdown plugin to address the problem.
      placeholder: |
        I'd like the Markdown plugin to...
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Participation
      options:
        - label: I am willing to submit a pull request for this change.
          required: false
  - type: markdown
    attributes:
      value: Please **do not** open a pull request until this issue has been accepted by the team.
  - type: checkboxes
    attributes:
      label: AI acknowledgment
      description: Please select one option and, if yes, briefly describe how AI was used (e.g., code, tests, docs) and which tool(s) you used.
      options:
        - label: No - I did not use AI to generate this issue report.
          required: false
        - label: Yes - minimal assistance (e.g., IDE autocomplete, small code completions, grammar fixes).
          required: false
        - label: Yes - substantive assistance (AI-generated non-trivial portions of code, tests, or documentation).
          required: false
  - type: textarea
    attributes:
      label: Additional comments
      description: Is there anything else that's important for the team to know?
