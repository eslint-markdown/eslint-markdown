name: "\U0001F4DD Docs"
description: 'Request an improvement to documentation'
title: 'Docs: (fill in)'
body:
  - type: textarea
    attributes:
      label: Docs page(s)
      description: |
        What page(s) are you suggesting be changed or created?
      placeholder: |
        e.g. https://eslint-markdown.lumir.page/docs/get-started/configurations
    validations:
      required: true
  - type: textarea
    attributes:
      label: What documentation issue do you want to solve?
      description: |
        Please explain your issue in as much detail as possible.
      placeholder: |
        The docs currently...
    validations:
      required: true
  - type: textarea
    attributes:
      label: What do you think is the correct solution?
      description: |
        Please explain how you'd like to change the docs to address the problem.
      placeholder: |
        I'd like the docs to...
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Participation
      options:
        - label: I am willing to submit a pull request for this change.
          required: false
  - type: markdown
    attributes:
      value: Please **do not** open a pull request until this issue has been accepted by the team.
  - type: checkboxes
    attributes:
      label: AI acknowledgment
      description: Please select one option and, if yes, briefly describe how AI was used (e.g., code, tests, docs) and which tool(s) you used.
      options:
        - label: No - I did not use AI to generate this issue report.
          required: false
        - label: Yes - minimal assistance (e.g., IDE autocomplete, small code completions, grammar fixes).
          required: false
        - label: Yes - substantive assistance (AI-generated non-trivial portions of code, tests, or documentation).
          required: false
  - type: textarea
    attributes:
      label: Additional comments
      description: Is there anything else that's important for the team to know?
